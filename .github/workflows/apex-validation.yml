name: Apex validation
on:
  workflow_dispatch:
    inputs:
      package_version_id:
        description: 'Optional 04t unmanaged package version to install instead of deploying source'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: apexjs-scratch-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --global @salesforce/cli@2.156.8
      - name: Authenticate dedicated CI Dev Hub
        env:
          SF_DEV_HUB_AUTH_URL: ${{ secrets.SF_DEV_HUB_AUTH_URL }}
        run: |
          if [ -z "$SF_DEV_HUB_AUTH_URL" ]; then
            echo 'Configure SF_DEV_HUB_AUTH_URL with a dedicated CI identity before running Apex validation.'
            exit 1
          fi
          printf '%s' "$SF_DEV_HUB_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --alias ci-dev-hub
      - name: Create scratch org
        id: scratch
        run: sf org create scratch --definition-file config/project-scratch-def.json --target-dev-hub ci-dev-hub --alias apexjs-ci --duration-days 1 --no-namespace --wait 30
      - name: Deploy source
        if: inputs.package_version_id == ''
        run: sf project deploy start --source-dir force-app --target-org apexjs-ci --wait 30
      - name: Install uploaded package
        if: inputs.package_version_id != ''
        env:
          PACKAGE_VERSION_ID: ${{ inputs.package_version_id }}
        run: |
          if [[ ! "$PACKAGE_VERSION_ID" =~ ^04t[A-Za-z0-9]{12}([A-Za-z0-9]{3})?$ ]]; then
            echo 'Provide a valid 15- or 18-character 04t package version ID.'
            exit 1
          fi
          sf package install --package "$PACKAGE_VERSION_ID" --target-org apexjs-ci --security-type AdminsOnly --no-prompt --publish-wait 10 --wait 10
      - run: sf org assign permset --name ApexJS_Author --target-org apexjs-ci
      - run: npm run test:apex -- --org apexjs-ci
      - run: npm run test:flows -- --org apexjs-ci
      - name: Delete scratch org
        if: always() && steps.scratch.outcome == 'success'
        run: sf org delete scratch --target-org apexjs-ci --no-prompt
